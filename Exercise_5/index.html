<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Design</title>
    <style>
        body{
            background-color: black
        }
        nav{
            background-color: aqua;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            
        }
        .logo{
            font-size: 25px;
            font-weight: bold;
        }
        ul{
            display: flex;
            list-style: none;
        }
        ul li{
            margin-left: 25px;

        }
        ul li a{
            text-decoration: none;
            font-size: 18px;
        }
        .parent{
    height: 650px;
    border: 2px solid;
    display: flex;
    justify-content: space-evenly; /* Left aur right me equal space */
    align-items: center;           /* Vertically center */
    background-color: gray;
}

.box1{
    width: 450px;
    height: 450px;
    background-color: red;
    border: 2px solid yellow;
}

.box2{
    width: 450px;
    height: 450px;
    background-color: greenyellow;
    border: 2px solid yellow;
}
      .card{
    width: 1000px;
    max-width: 90%;
    height: 100px;
    border: 2px solid green;
    border-radius: 50px;
    margin: 20px auto;
    text-align: center;
    background-color: palevioletred;
}
        .card p{
            color:wheat;
            font-size: 30px;
        }
button{
    width: 80px;
    height: 80px;
    border: none;
    border-radius: 50%;
    background: coral;
    color: white;
    font-size: 30px;
    cursor: pointer;

    position: fixed;
    bottom: 20px;
    right: 20px;
}
         footer{
            
            height: 60px;
            border: 3px solid;
            margin: 5px;
            background-color: blueviolet;
         }
       
    </style>
</head>
<body>
    <nav>
        <div class="logo">
        MyLogo
        </div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Product</a></li>
        </ul>
    </nav> 
    <div class="parent">
          <div class="box1"></div>
          <div class="box2"></div> 
    </div>

    <div class="card">
     <p>Welcome to this Sigma Web Development Express</p>
    </div>
     
    <button></button>
    
    <footer>
    </footer>
</body>
</html>
