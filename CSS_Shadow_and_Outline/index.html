<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 51px;
            margin: 100px;
        box-shadow: 0px 10px  10px #d69e9e;
           
        }

        .text-element {
            text-shadow: 9px 4px 4px  #17ed1e;

            outline: 2px solid black;
            border: 8px solid green;
            outline-offset: 27px;
            border-radius: 17px;
            margin: 200px;
        }
    </style>
</head>

<body>
    <!-- <div class="box">
        I am a box
    </div> -->

    <div class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum, quis totam nulla repellendus aperiam culpa ut
        placeat tempore fugiat dolorum debitis. Dicta, ex!
    </div>
</body>

</html>
