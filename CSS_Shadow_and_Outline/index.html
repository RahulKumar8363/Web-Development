<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 3px;
            box-shadow: 5px 10px #f66161;
        }

        .text-element {
            /*text-shadow: 2px 2px 4px #ed1717;*/
            outline: 2px solid black;
            border: 6px solid green;
            outline-offset: 27px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <!-- <div class="box">
        I am a box
    </div> -->

    <div class="text-element">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Veritatis voluptate quam
        voluptas. Exercitationem sit sapiente commodi explicabo quasi placeat suscipit ex temporibus consequatur.

    </div>
</body>

</html>
