<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS MultiColor Website</title>
    <style>
        :root{
            --primary-color:rgb(177, 90, 179);
            --text-color:white;
            --secondary-color:#e3cff5cc;
        }
        body{
            background-color: var(--secondary-color);
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            background-color: var(--primary-color);
            color:var(--text-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
        }
        .logo{
            font-size: 24px;
            font-weight: bold;
        }
        ul{
            display: flex;
            list-style: none;
        }
        ul li{
            margin-left: 25px;
        }

        ul li a{
            color:var(--text-color);
            text-decoration: none;
            font-size: 18px;
        }

        ul li a:hover{
            color: yellow;
        }

    </style>
</head>
<body>
    <nav>
        <div class="logo">
            MyLogo
        </div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
