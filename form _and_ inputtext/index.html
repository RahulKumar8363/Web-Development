<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms practices</title>
</head>
<body>
    <h1>Form to apply for RAHUL Course</h1>
    <form action="post">
       <!-- full name -->
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter Your full name" required><br><br>

        <!-- Email -->
       <label for="email">Email</label>
       <input type="email" id="email" name="email" placeholder="Enter your Email id" required><br><br>

       <!-- Password -->
        <label for="Password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required><br><br>

        <!-- PhoneNumber -->
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your Phone Number" required><br><br>

        <!-- Date of Birth -->
         <label for="dob">Date of Birth</label>
         <input type="date" id="dob" name="dob" required><br><br>

         <!-- Gender -->
          <label>Gender:</label>
          <input type="radio" name="male" id="gender" value="male">
          <label for="male">Male</label>

          <input type="radio" name="female" id="gender" value="female">
          <label for="female">Female</label> <br><br>

          <!-- course -->
           <label for="course">Select Course</label>
           <select name="course" id="course" required>
            <option value="">--Select Course--</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="IEEE">Electrical Engineering</option>
            <option value="ME">Mechnical Engineering</option>
           </select><br><br>

           <!-- Skills -->
            <label>Skills:</label>
            <input type="checkbox" name="Html" id="html" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label><br><br>

            <!-- Address -->

            <label for="address">Address</label><br>
            <textarea name="address" id="address" rows="4" cols="30" placeholder="Enter your Address"></textarea><br><br>

            <!-- Buttons -->

            <button type="submit">Register</button>
            <button type="reset">Reset</button>
            </form>
</body>
</html>
